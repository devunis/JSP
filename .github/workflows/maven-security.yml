name: Maven security regression

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        module: [TEST, ServletTest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Test XML namespace parsing with a bounded heap
        run: >-
          mvn -B -f ${{ matrix.module }}/pom.xml test
          -Dmaven.compiler.source=12 -Dmaven.compiler.target=12
          -DargLine=-Xmx64m
